# fly.toml for Tarelka-Bot (Telegram long-polling + tiny health HTTP)

app = 'tarelka-bot'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/kbju.db'
  TIMEZONE = 'Europe/Moscow'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[mounts]]
  source = 'data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
